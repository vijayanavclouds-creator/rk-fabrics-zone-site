<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600&display=swap');

  .rfz-hero {
    position: relative;
    width: calc(100% - 34px);
    max-width: none;
    min-height: 90dvh;
    display: flex;
    flex-direction: column;
    margin: 24px auto;
    
    border: 2px solid rgba(255, 255, 255, 0.8);
    border-radius: 36px;
    background: #f4f8fc;
    box-shadow: 24px 24px 48px rgba(200, 210, 220, 0.6), 
               -24px -24px 48px rgba(255, 255, 255, 1);
    
    overflow: hidden;
    box-sizing: border-box;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  .rfz-hero *, .rfz-hero *::before, .rfz-hero *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  .rfz-hero .rfz-inner {
    position: relative;
    flex: 1;
    width: 100%;
    min-height: clamp(530px, 71vw, 944px);
    display: flex; /* Changed from grid so we can freely overlap elements */
    align-items: stretch;
  }

  .rfz-hero .rfz-left {
    position: relative;
    z-index: 4;
    width: clamp(500px, 55%, 800px); /* Gives the text just the left 55% of the card */
    padding: clamp(40px, 5vw, 112px) clamp(20px, 3.5vw, 44px) clamp(24px, 4vw, 92px) clamp(20px, 4.5vw, 72px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: transparent; 
  }

  .rfz-hero .rfz-title {
    position: relative;
    z-index: 2;
    font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
    font-size: clamp(38px, 5.2vw, 86px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: #1a2b49;
    margin-bottom: clamp(16px, 2vw, 24px);
    max-width: 760px;
  }

  .rfz-hero .rfz-accent-1 {
    color: #37546d; 
  }

  .rfz-hero .rfz-accent-2 {
    color: #4a627a; 
  }

  .rfz-hero .rfz-subtitle {
    position: relative;
    z-index: 2;
    font-size: clamp(14px, 1.5vw, 22px);
    line-height: 1.5;
    color: #4a627a;
    max-width: 720px;
    margin-bottom: clamp(24px, 3vw, 40px);
    font-weight: 400;
  }

  .rfz-hero .rfz-btn {
    position: relative;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    width: max-content;
    background: linear-gradient(180deg, #ffffff 0%, #edf3f9 100%);
    color: #1a2b49;
    font-size: clamp(13px, 1.2vw, 16px);
    font-weight: 600;
    padding: clamp(12px, 1.25vw, 16px) clamp(24px, 2.3vw, 36px);
    border: 1px solid rgba(26, 43, 73, 0.1);
    border-radius: 999px;
    box-shadow: 0 16px 26px rgba(26, 43, 73, 0.08), inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -2px 6px rgba(26, 43, 73, 0.05);
    cursor: pointer;
    transition: all .25s ease;
    text-decoration: none;
  }

  .rfz-hero .rfz-btn:hover { 
    transform: translateY(-2px); 
    box-shadow: 0 20px 30px rgba(26, 43, 73, 0.12), inset 0 1px 0 rgba(255,255,255,1); 
  }

  /* --- TRUST BADGES (BOTTOM LEFT) --- */
  .rfz-trust-badges {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: flex-start;
    gap: clamp(8px, 1vw, 16px); 
    margin-top: auto; 
    padding-top: clamp(32px, 5vw, 60px); 
    flex-wrap: wrap; 
  }

  .rfz-badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    max-width: 80px;
    flex: 1;
  }

  .rfz-badge-icon {
    width: 42px; 
    height: 42px; 
    border-radius: 50%;
    border: 1px solid rgba(26, 43, 73, 0.15); 
    background: rgba(255, 255, 255, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .rfz-badge-icon svg {
    width: 18px; 
    height: 18px; 
    stroke: #1a2b49;
    fill: none;
    stroke-width: 1.25; 
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .rfz-badge-text {
    font-size: 10px; 
    font-weight: 600;
    color: #4a627a;
    text-transform: uppercase;
    text-align: center;
    letter-spacing: 0.05em;
    line-height: 1.4;
  }

  /* --- RIGHT SECTION (IMAGES) --- */
  .rfz-hero .rfz-right {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 85%; /* Pulls the image far to the left, behind the text! */
    z-index: 1;
    overflow: hidden;
    background: transparent;
    
    /* Fades the left 35% of the image so it perfectly blends into the background */
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 35%);
    mask-image: linear-gradient(to right, transparent 0%, black 35%);
  }

    /* --- GENERAL SLIDE SETTINGS --- */
  .rfz-hero .rfz-slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    opacity: 0; 
    /* Notice: object-position is removed from here! */
  }

  /* --- SPECIFIC SETTINGS FOR EVERY SINGLE IMAGE --- */
  
  /* Image 1 */
  .rfz-hero .rfz-slide-1 { 
    animation: rfz-fade1 25s ease-in-out infinite; 
    object-position: right 30%; /* Focus on right side, slightly above middle */
  }
  
  /* Image 2 */
  .rfz-hero .rfz-slide-2 { 
    animation: rfz-fade2 25s ease-in-out infinite; 
    object-position: right 10%; /* Perfectly centered */
  }
  
  /* Image 3 */
  .rfz-hero .rfz-slide-3 { 
    animation: rfz-fade3 25s ease-in-out infinite; 
    object-position: right center; /* Center height, flush to the right */
  }
  
  /* Image 4 */
  .rfz-hero .rfz-slide-4 { 
    animation: rfz-fade4 25s ease-in-out infinite; 
    object-position: center 20%; /* Centered width, focused near the top */
  }
  
  /* Image 5 */
  .rfz-hero .rfz-slide-5 { 
    animation: rfz-fade5 25s ease-in-out infinite; 
    object-position: left center; /* Center height, flush to the left */
  }


  @keyframes rfz-fade1 { 0%, 10% { opacity: 1; } 20%, 90% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes rfz-fade2 { 0%, 10% { opacity: 0; } 20%, 30% { opacity: 1; } 40%, 100% { opacity: 0; } }
  @keyframes rfz-fade3 { 0%, 30% { opacity: 0; } 40%, 50% { opacity: 1; } 60%, 100% { opacity: 0; } }
  @keyframes rfz-fade4 { 0%, 50% { opacity: 0; } 60%, 70% { opacity: 1; } 80%, 100% { opacity: 0; } }
  @keyframes rfz-fade5 { 0%, 70% { opacity: 0; } 80%, 90% { opacity: 1; } 100% { opacity: 0; } }

  .rfz-hero .rfz-slide-1 { animation: rfz-fade1 25s ease-in-out infinite; }
  .rfz-hero .rfz-slide-2 { animation: rfz-fade2 25s ease-in-out infinite; }
  .rfz-hero .rfz-slide-3 { animation: rfz-fade3 25s ease-in-out infinite; }
  .rfz-hero .rfz-slide-4 { animation: rfz-fade4 25s ease-in-out infinite; }
  .rfz-hero .rfz-slide-5 { animation: rfz-fade5 25s ease-in-out infinite; }

  /* OVERLAPPING MOBILE LAYOUT */
  @media (max-width: 1100px) {
    .rfz-hero .rfz-left { 
      width: 100%; 
      padding-left: clamp(24px, 4vw, 48px); 
      /* Ensures text is completely readable on small screens */
      background: linear-gradient(to right, #f4f8fc 30%, rgba(244,248,252, 0.7) 60%, transparent 100%);
    }

    .rfz-hero .rfz-right {
      width: 100%;
      -webkit-mask-image: none;
      mask-image: none;
    }
    
    .rfz-hero .rfz-title, 
    .rfz-hero .rfz-subtitle {
      width: max-content;
      max-width: calc(100vw - 90px); 
      white-space: normal;
    }
  }

  /* SMALL MOBILE ELEMENT SIZING */
  @media (max-width: 768px) {
    .rfz-hero {
        border-radius: 0;
        width: 100%;
        margin: 0;
        border: none;
        box-shadow: none;
        height: auto;
        min-height: auto;
        display: block;
        overflow: hidden;
    }

    .rfz-hero .rfz-inner {
      min-height: auto;
      height: auto;
      display: flex;
      flex-direction: column;
    }

    .rfz-hero .rfz-right {
      height: 75vw;
      position: relative;
      width: 100%;
      order: -1;
    }

    .rfz-hero .rfz-slide {
      object-position: center 15% !important;
    }

    .rfz-hero .rfz-left {
        position: relative;
        width: 100%;
        height: auto;
        margin-top: -130px; /* Pulls text up over the bottom of the image */
        padding-top: 26px; /* Pushes text down into the gradient overlap */
        padding-right: 16px;
        padding-left: 16px;
        padding-bottom: 32px;
        /* Gradient fades in downwards, becoming solid #f4f8fc right where the image ends (130px) */
        background: linear-gradient(to bottom, transparent 0%, rgba(244,248,252,0.4) 50px, rgba(244,248,252, 0.9) 110px, #f4f8fc 130px, #f4f8fc 100%);
        display: flex;
        flex-direction: column;
        align-items: flex-start; /* Keeps title and subtitle on the left */
        z-index: 5;
    }
    
    .rfz-hero .rfz-title {
      padding-left: 0;
      font-size: clamp(22px, 6vw, 28px);
      margin-bottom: 6px;
      line-height: 1.1;
    }
    
    .rfz-hero .rfz-subtitle {
      padding-left: 0;
      font-size: 11px; 
      margin-bottom: 0px; 
      line-height: 1.3;
    }
    
    .rfz-hero .rfz-btn {
        align-self: center; /* Centers the button horizontally */
        margin-left: 0;
        margin-top: 28px; /* Pushes button down so it sits on the solid background below image */
        padding: 9px 20px;
        font-size: 12px;
        gap: 6px;
    }

    .rfz-trust-badges {
        align-self: center; /* Centers the badges horizontally */
        margin-left: 0;
        margin-top: 24px;
        margin-bottom: 0px;
        padding-top: 0;
        gap: 8px;
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
    }
    .rfz-badge {
      flex: 0 1 auto;
      max-width: none;
      gap: 4px;
    }
    .rfz-badge-icon {
      width: 32px; 
      height: 32px;
    }
    .rfz-badge-icon svg {
      width: 15px;
      height: 15px;
    }
    .rfz-badge-text {
      font-size: 7px; 
      letter-spacing: 0;
      line-height: 1.2;
    }
  }
</style>
